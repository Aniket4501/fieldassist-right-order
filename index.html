<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1B2D">
  <meta name="color-scheme" content="light">
  <title>GT App · Demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1B2D'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23FFFFFF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/ro-order.css">
  <link rel="stylesheet" href="css/ro-review.css">
  <link rel="stylesheet" href="css/ro-outlet.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Slim demo bar, mounted once by js/app.js; hidden on the login screen -->
    <div id="demo-bar-root" hidden></div>

    <!-- Every screen renders here -->
    <main id="screen" tabindex="-1">
      <!-- Static loading state. js/app.js replaces it once the data has loaded. -->
      <div class="boot">
        <p class="boot__title">Loading…</p>
        <div class="boot__help">
          <p>Still loading? If you opened this file directly, it needs a local server. Run:</p>
          <pre class="code">cd prototype &amp;&amp; python3 -m http.server 8000</pre>
          <p>Then open the address it prints in your browser.</p>
        </div>
      </div>
    </main>

    <!-- Bottom sheets and toasts -->
    <div id="overlay-root"></div>
  </div>

  <noscript>
    <div class="noscript">This demo needs JavaScript. Turn it on in your browser and reload.</div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
